[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/*"]

[tool.ruff.lint]
# Don't enforce E402 (module imports not at top) — we use this pattern
# extensively in api/index.py to manipulate sys.path before importing
# project modules. Don't enforce E501 (line length) here — we use 120
# in this project, not 88.
ignore = ["E402", "E501"]
